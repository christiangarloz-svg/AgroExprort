<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AgroExport Ica - Estimación de Cosecha</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }
        body { background-color: #f0f4f8; display: flex; justify-content: center; align-items: center; min-height: 100vh; color: #333; }
        .card { background: white; padding: 40px; border-radius: 16px; box-shadow: 0 10px 25px rgba(0,0,0,0.08); width: 100%; max-width: 500px; }
        .header { text-align: center; margin-bottom: 30px; }
        .header h1 { font-size: 24px; color: #1b4332; margin-bottom: 8px; }
        .header p { font-size: 14px; color: #6c757d; }
        .form-group { margin-bottom: 18px; }
        label { display: block; font-size: 13px; font-weight: 600; color: #495057; margin-bottom: 6px; }
        input { width: 100%; padding: 12px 14px; border: 1px solid #ced4da; border-radius: 8px; font-size: 15px; transition: border-color 0.2s; }
        input:focus { border-color: #2d6a4f; outline: none; box-shadow: 0 0 0 3px rgba(45, 106, 79, 0.15); }
        button { width: 100%; background-color: #2d6a4f; color: white; border: none; padding: 14px; border-radius: 8px; font-size: 16px; font-weight: 600; cursor: pointer; transition: background 0.2s; margin-top: 10px; }
        button:hover { background-color: #1b4332; }
        .result-box { margin-top: 25px; background: #e8f5e9; border-left: 5px solid #2d6a4f; padding: 15px; border-radius: 6px; text-align: center; display: none; }
        .result-box h3 { font-size: 14px; color: #2d6a4f; margin-bottom: 5px; text-transform: uppercase; letter-spacing: 0.5px; }
        .result-value { font-size: 28px; font-weight: 700; color: #1b4332; }
    </style>
</head>
<body>

    <div class="card">
        <div class="header">
            <h1>🍇 AgroExport Ica</h1>
            <p>Optimización Inteligente de Rendimiento de Cosecha</p>
        </div>

        <form id="agroForm">
            <div class="form-group">
                <label>Área Cultivada (Hectáreas)</label>
                <input type="number" id="hectareas" step="0.1" placeholder="Ej. 15.5" required>
            </div>
            <div class="form-group">
                <label>Agua de Riego Aplicada ($m^3$)</label>
                <input type="number" id="agua_riego_m3" step="100" placeholder="Ej. 145000" required>
            </div>
            <div class="form-group">
                <label>Radiación Solar Acumulada (Horas)</label>
                <input type="number" id="radiacion_solar_horas" step="10" placeholder="Ej. 2400" required>
            </div>
            <div class="form-group">
                <label>Cantidad de Fertilizante (Kg)</label>
                <input type="number" id="fertilizante_kg" step="10" placeholder="Ej. 7000" required>
            </div>
            <div class="form-group">
                <label>Antigüedad del Terreno / Parrón (Años)</label>
                <input type="number" id="antiguedad_terreno" step="1" placeholder="Ej. 6" required>
            </div>

            <button type="submit">Estimar Toneladas de Cosecha</button>
        </form>

        <div class="result-box" id="resultBox">
            <h3>Producción Estimada por IA:</h3>
            <div class="result-value" id="resultValue">--</div>
        </div>
    </div>

    <script>
        document.getElementById('agroForm').addEventListener('submit', async function(e) {
            e.preventDefault();

            const data = {
                hectareas: parseFloat(document.getElementById('hectareas').value),
                agua_riego_m3: parseFloat(document.getElementById('agua_riego_m3').value),
                radiacion_solar_horas: parseFloat(document.getElementById('radiacion_solar_horas').value),
                fertilizante_kg: parseFloat(document.getElementById('fertilizante_kg').value),
                antiguedad_terreno: parseInt(document.getElementById('antiguedad_terreno').value)
            };

            try {
                const response = await fetch('/predecir', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(data)
                });

                const result = await response.json();
                
                document.getElementById('resultValue').innerText = `${result.toneladas_estimadas} Toneladas`;
                document.getElementById('resultBox').style.display = 'block';
            } catch (error) {
                alert('Ocurrió un error al conectar con el servidor de IA.');
            }
        });
    </script>
</body>
</html>
